plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.brzoskid.webosiptv'
    compileSdk 33

    defaultConfig {
        applicationId "pl.brzoskid.webosiptv"
        minSdk 21
        targetSdk 29
        versionCode 8
        versionName "8.0"
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'org.jellyfin.exoplayer:exoplayer-ffmpeg-extension:2.13.3+1'
}
